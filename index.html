<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CREATIVE CREW</title>
<style>
:root{--bg:#17161f;--c:#25233a;--c2:#302d4a;--p:#8b5cf6;--b:#3b82f6;--o:#ff6b57;--t:#f4f2ff;--m:#a09cc0;--g:#34d399;--y:#fbbf24;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:#0e0d14;color:var(--t);font:15px/1.4 system-ui,-apple-system,sans-serif;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
#app{width:100%;max-width:430px;min-height:100vh;background:var(--bg);padding:env(safe-area-inset-top) 0 90px}
.pad{padding:14px 16px}.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0}
.logo{font-weight:800;letter-spacing:.5px}.logo span{color:var(--o)}
.seg{display:flex;background:var(--c);border-radius:99px;padding:3px}.seg button{border:0;background:none;color:var(--m);padding:6px 12px;border-radius:99px;font-weight:600;font-size:13px}.seg .on{background:var(--p);color:#fff}
.card{background:var(--c);border-radius:22px;padding:16px;margin-bottom:12px}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:14px}.hd>div:last-child{flex:1}
.sp{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:10px;background:#15131f;border-radius:9px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--b));border-radius:9px}
small{color:var(--m);font-size:12.5px}h2{font-size:20px}h3{margin:4px 0 10px;font-size:16px}
.big{width:100%;border:0;border-radius:26px;padding:22px;font-size:22px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--o),#ff9a6b);box-shadow:0 8px 24px #ff6b5740;margin-top:12px}
.big.out{background:linear-gradient(135deg,var(--p),var(--b));box-shadow:0 8px 24px #8b5cf640}.big:disabled{background:var(--c2);box-shadow:none;color:var(--m)}
.chip{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#ffffff1f;white-space:nowrap}
.hadir{color:var(--g)}.telat{color:var(--y)}.belum{color:var(--m)}.absen{color:#f87171}.libur{color:#60a5fa}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff14}.row:last-child{border:0}.row>div:nth-child(2){flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:8px 12px;font-weight:700;background:var(--c2)}.btn.p{background:var(--p)}.btn.o{background:var(--o)}.btn.g{background:#15803d}
input,textarea,select{width:100%;background:#15131f;color:var(--t);border:1px solid #ffffff2e;border-radius:14px;padding:12px;margin:4px 0 10px;font:inherit}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;background:#1f1d2e;border-top:1px solid #ffffff14;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:0;background:none;color:var(--m);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}.nav b{font-size:20px;font-weight:400}.nav .on{color:var(--t)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid div{border-radius:16px;padding:4px;background:#15131f;border:2px solid transparent}.grid .on{border-color:var(--o);background:#3a2433}.grid svg{width:100%;height:auto}
.sheet{position:fixed;inset:0;background:#000000aa;display:flex;align-items:flex-end;justify-content:center;z-index:9}.sheet>div{width:100%;max-width:430px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:18px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--g);color:#052;padding:10px 16px;border-radius:99px;font-weight:700;z-index:20}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 3px;text-align:center}td:first-child,th:first-child{text-align:left}th{color:var(--m);font-weight:600}tr+tr{border-top:1px solid #ffffff14}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stat b{display:block;font-size:22px}
.late{background:linear-gradient(135deg,#3b2a55,#2a2f5c)}.mid{text-align:center}
</style></head><body><div id="app"></div>
<script>
const K='#15121f',$=id=>document.getElementById(id),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// [kulit, rambut, gaya rambut, mata, mulut]
const A=[['#ffd9c7','#15121f',0,0,0],['#ffd9c7','#ff7eb6',2,3,1],['#ffd9c7','#ff5547',5,1,2],['#6b3a22','#3b6bff',1,1,4],['#ffd9c7','#ffd23f',1,0,0],['#9a5b3a','#ff3b3b',0,1,1],['#ffd9c7','#3b6bff',1,2,2],['#ffe2d2','#9b7bff',0,5,0],['#f2b48c','#ff5547',0,5,0],['#6b3a22','#9b7bff',5,2,2],['#e8a77c','#1fa463',2,2,0],['#ffe2d2','#ff5547',4,3,1],['#ffd9c7','#3b6bff',3,0,1],['#e8a77c','#ffd23f',2,1,2],['#ffd9c7','#3b6bff',4,1,3],['#ffd9c7','#ffffff',6,2,0],['#9a5b3a','#1fa463',0,3,4],['#ffe2d2','#15121f',2,3,1],['#ffd9c7','#ff7eb6',4,1,3],['#e8a77c','#15121f',0,4,1]];
function av(i,s=56){const[sk,hc,h,e,m]=A[i],f=`fill="${hc}" stroke="${K}" stroke-width="3"`,L=`stroke="${K}" stroke-width="3" fill="none" stroke-linecap="round"`,X=[38,62];let b='',t='';
if(h==0)b=[[28,40,16],[72,40,16],[50,24,18],[34,26,15],[66,26,15],[22,58,12],[78,58,12]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" ${f}/>`).join('');
if(h==1)b=`<rect x="14" y="20" width="72" height="74" rx="28" ${f}/>`;
if(h==2)b=`<rect x="18" y="22" width="64" height="56" rx="24" ${f}/>`;
if(h==5)b=[[22,24,11],[78,24,11]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" ${f}/>`).join('');
if(h==6)b=[[24,54,10],[76,54,10]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" ${f}/>`).join('');
if([0,1,2,5].includes(h))t=`<path d="M26 50Q26 26 50 26Q74 26 74 50Q60 40 50 40Q40 40 26 50Z" ${f}/>`;
if(h==3)t=`<path d="M26 44L28 20L38 34L46 14L54 32L64 16L70 34L76 22L74 44Q50 34 26 44Z" ${f}/>`;
if(h==4)t=`<path d="M24 46Q24 18 52 18Q76 18 76 46Z" ${f}/><rect x="10" y="42" width="44" height="8" rx="4" ${f}/>`;
if(h==6)t=`<path d="M30 42Q50 24 70 42Q50 34 30 42Z" ${f}/>`;
let ey='';
if(e==0)ey=X.map(x=>`<ellipse cx="${x}" cy="57" rx="6" ry="4" fill="#fff" stroke="${K}" stroke-width="2.5"/><circle cx="${x}" cy="58" r="1.8" fill="${K}"/><path d="M${x-7} 54h14" ${L}/>`).join('');
if(e==1)ey=X.map(x=>`<circle cx="${x}" cy="56" r="7" fill="#fff" stroke="${K}" stroke-width="2.5"/><circle cx="${x}" cy="56" r="2.6" fill="${K}"/>`).join('');
if(e==2)ey=[31,53].map(x=>`<rect x="${x}" y="50" width="16" height="11" rx="4" fill="#33308a" stroke="${K}" stroke-width="2.5"/>`).join('')+`<path d="M47 55h6" ${L}/>`;
if(e==3)ey=`<path d="M32 58q6-8 12 0M56 58q6-8 12 0" ${L}/>`;
if(e==4)ey=X.map(x=>`<text x="${x}" y="63" font-size="17" text-anchor="middle" fill="#e5334b">♥</text>`).join('');
if(e==5)ey=X.map(x=>`<ellipse cx="${x}" cy="58" rx="6" ry="3.5" fill="#fff" stroke="${K}" stroke-width="2.5"/><circle cx="${x}" cy="58" r="1.7" fill="${K}"/>`).join('')+`<path d="M31 49l14 4M69 49l-14 4" ${L}/>`;
const mo=['<path d="M44 71h12" '+L+'/>','<path d="M42 68q8 8 16 0" '+L+'/>',`<ellipse cx="50" cy="71" rx="3" ry="4" fill="#e5334b" stroke="${K}" stroke-width="2"/>`,`<path d="M42 67h16q0 10-8 10t-8-10z" fill="#e5334b" stroke="${K}" stroke-width="2.5"/>`,`<path d="M41 67h18q0 10-9 10t-9-10z" fill="#fff" stroke="${K}" stroke-width="2.5"/>`][m];
return `<svg viewBox="0 0 100 100" width="${s}" height="${s}" style="display:block;flex:none">${b}<circle cx="26" cy="58" r="5" fill="${sk}" stroke="${K}" stroke-width="3"/><circle cx="74" cy="58" r="5" fill="${sk}" stroke="${K}" stroke-width="3"/><rect x="26" y="32" width="48" height="48" rx="20" fill="${sk}" stroke="${K}" stroke-width="3.5"/><ellipse cx="34" cy="67" rx="5" ry="3" fill="#ff8aa0" opacity=".7"/><ellipse cx="66" cy="67" rx="5" ry="3" fill="#ff8aa0" opacity=".7"/>${ey}${mo}${t}</svg>`}
// data
const pad=n=>String(n).padStart(2,'0'),fmt=m=>pad(Math.floor(m/60))+':'+pad(m%60),mins=t=>{const[a,b]=t.split(':');return+a*60+ +b},START=540,END=1020,late=t=>Math.max(0,mins(t)-START),early=t=>Math.max(0,END-mins(t));
const D=['Rab 25','Sel 24','Sen 23','Jum 20','Kam 19','Rab 18','Sel 17','Sen 16','Jum 13','Kam 12','Rab 11','Sel 10'];
const ST=['belum','hadir','telat','hadir','telat','belum','hadir','belum'],TI=['','08:52','09:40','08:58','09:25','','08:45',''];
const emps=[['Raka Pratama','Art Director',0,1240,12],['Sari Dewi','Ilustrator',1,1620,21],['Made Wirawan','Motion Designer',3,980,6],['Nia Anggraini','Copywriter',4,1410,15],['Bayu Santoso','Videografer',12,760,3],['Citra Lestari','UI Designer',13,1130,9],['Dimas Putra','Account Manager',19,890,4],['Luh Ayu','Social Media',17,1520,18]].map(([n,r,a,xp,sk],i)=>({id:i,n,r,a,xp,sk,st:ST[i],tin:TI[i],tout:'',h:D.map((d,k)=>{const q=(i*7+k*13)%10;if(q==0)return{d,st:'absen',late:0};if(q==1)return{d,st:'libur',late:0};const l=q<5?0:(q-4)*6+i,eo=q==3?40:q==2?15:0;return{d,st:l+eo?'telat':'hadir',tin:l?fmt(START+l):`08:${40+(k*3+i)%20}`,tout:fmt(END-eo+(eo?0:k%6)),late:l+eo,eo}})}));
let tasks=[{who:4,p:'Brand Kopi Senja',l:'Kafe Senja, Denpasar',w:'Meeting konsep dengan klien',s:'pending'},{who:6,p:'Shooting Toko Batik',l:'Ubud, Gianyar',w:'Dokumentasi produk di lokasi klien',s:'pending'},{who:1,p:'Mural Pantai Sanur',l:'Sanur',w:'Survei dinding mural',s:'disetujui'}];
const S={role:'emp',tab:'home',me:0,det:null,edit:null,demo:'09:15',demoOut:'17:02',f:{},t:''};
const X=()=>emps[S.me],lt=e=>(e.tin?late(e.tin):0)+(e.tout?early(e.tout):0);
const ms=e=>{const a=[...e.h,{st:e.st,late:lt(e)}],c=s=>a.filter(x=>x.st==s).length;return{l:a.reduce((s,x)=>s+x.late,0),h:c('hadir')+c('telat'),t:c('telat'),a:c('absen'),o:c('libur')}};
const chip=(st,l,t)=>`<span class="chip ${st}">${{hadir:'Hadir'+(t?' '+t:''),telat:'Telat '+l+' mnt',belum:'Belum hadir',absen:'Absent',libur:'Day Off'}[st]}</span>`;
const chipE=e=>chip(e.st,lt(e),e.tin);
const toast=m=>{S.t=m;R();setTimeout(()=>{S.t='';R()},1800)};
const setRole=r=>{S.role=r;S.tab=r=='emp'?'home':'dash';S.det=null;S.edit=null;R()};
const tab=t=>{S.tab=t;S.edit=null;R()};
function clockIn(){const e=X(),l=late(S.demo);e.st=l?'telat':'hadir';e.tin=S.demo;e.xp+=l?10:25;toast(l?`Clock In • telat ${l} menit`:'Clock In tepat waktu! +25 XP')}
function clockOut(){const e=X(),k=early(S.demoOut);e.tout=S.demoOut;if(k)e.st='telat';e.xp+=k?0:10;toast(k?`Pulang awal ${k} menit → dihitung telat`:'Clock Out berhasil. Sampai besok! 👋')}
function setSt(id,s){const e=emps[id];e.st=s;if(s!='hadir'&&s!='telat')e.tin='';if(s=='hadir'&&!e.tin)e.tin='09:30';S.det=null;toast('Status '+e.n.split(' ')[0]+' diubah')}
function sendTask(){const f=S.f;if(!f.p||!f.l||!f.w)return toast('Isi semua kolom dulu ya');tasks.unshift({who:S.me,p:f.p,l:f.l,w:f.w,s:'pending'});S.f={};toast('Pengajuan terkirim ✓')}
function decide(i,s){tasks[i].s=s;toast('Pengajuan '+s)}
function saveProf(){const d=S.edit;if(!d.n.trim())return toast('Nama tidak boleh kosong');Object.assign(X(),{n:d.n.trim(),r:d.r.trim()||'Kreator',a:d.a});S.edit=null;toast('Profil disimpan ✓')}
const hist=e=>[{d:'Kam 26',st:e.st,tin:e.tin,tout:e.tout,late:lt(e),eo:e.tout?early(e.tout):0},...e.h].filter(x=>x.st!='belum').map(x=>`<div class="row"><div><b>${x.d}</b></div><div><small>${x.tin||'—'} → ${x.tout||'—'}${x.eo?'<br>pulang awal '+x.eo+' mnt':''}</small></div>${chip(x.st,x.late,'')}</div>`).join('');
const lateCard=e=>{const m=ms(e);return `<div class="card late" onclick="tab('hist')"><div class="sp"><div><small>Total telat bulan ini (termasuk pulang awal)</small><h2>${m.l} menit</h2></div><div style="font-size:34px">⏰</div></div><small>${m.t}× telat · ${m.h} hari hadir · ${m.a} absent · ${m.o} day off</small></div>`};
// views
function home(){const e=X(),lv=Math.floor(e.xp/500)+1,pc=e.xp%500/5,done=e.tout,inn=e.st=='hadir'||e.st=='telat';
return `<div class=pad><div class=hd>${av(e.a,66)}<div><small>Halo, selamat bekerja 👋</small><h2>${E(e.n)}</h2><small>${E(e.r)}</small></div></div>
<div class=card><div class=sp><b>Level ${lv}</b><b>🔥 ${e.sk} hari streak</b></div><div class=bar><i style="width:${pc}%"></i></div><small>${e.xp} XP · ${500-e.xp%500} XP lagi ke Level ${lv+1}</small></div>
<div class=card><div class=sp><div><small>Kamis, 26 November 2026</small><div><b>🕘 Jam kerja 09.00–17.00 WITA</b></div></div></div>
<div class=sp style="margin-top:10px"><small>Status hari ini</small>${chipE(e)}</div>
${e.st=='belum'?`<small style="display:block;margin-top:10px">Jam demo (simulasi):</small><select onchange="S.demo=this.value"><option value="08:55" ${S.demo=='08:55'?'selected':''}>08.55 — tepat waktu</option><option value="09:15" ${S.demo=='09:15'?'selected':''}>09.15 — telat 15 menit</option><option value="09:50" ${S.demo=='09:50'?'selected':''}>09.50 — telat 50 menit</option></select><button class=big onclick="clockIn()">Clock In</button>`
:inn&&!done?`<small style="display:block;margin-top:10px">Jam pulang demo (simulasi):</small><select onchange="S.demoOut=this.value"><option value="16:20">16.20 — pulang awal 40 menit</option><option value="16:45">16.45 — pulang awal 15 menit</option><option value="17:02" selected>17.02 — tepat waktu</option></select><button class="big out" onclick="clockOut()">Clock Out</button><small style="display:block;margin-top:8px">Masuk pukul ${e.tin} WITA</small>`
:`<button class=big disabled>Selesai hari ini ✓</button><small style="display:block;margin-top:8px">${e.tin||'—'} → ${e.tout||'—'}</small>`}</div>
${lateCard(e)}</div>`}
function hist_(){const e=X(),m=ms(e);return `<div class=pad><h2 style="margin-bottom:12px">Riwayat Absensi</h2>${lateCard(e)}<div class="card stat"><div><b class=hadir>${m.h}</b><small>Hadir</small></div><div><b class=absen>${m.a}</b><small>Absent</small></div><div><b class=libur>${m.o}</b><small>Day Off</small></div></div><div class=card><h3>November 2026</h3>${hist(e)}</div></div>`}
function tk(adm){const L=adm?tasks.map((t,i)=>[t,i]):tasks.map((t,i)=>[t,i]).filter(([t])=>t.who==S.me),f=S.f;
const form=adm?'':`<div class=card><h3>Ajukan Tugas Luar Kantor</h3><small>Nama proyek / klien</small><input value="${E(f.p||'')}" oninput="S.f.p=this.value" placeholder="mis. Brand Kopi Senja"><small>Lokasi</small><input value="${E(f.l||'')}" oninput="S.f.l=this.value" placeholder="mis. Kafe Senja, Denpasar"><small>Alasan</small><textarea rows=3 oninput="S.f.w=this.value" placeholder="Jelaskan singkat">${E(f.w||'')}</textarea><button class="btn o" style="width:100%;padding:14px" onclick="sendTask()">Kirim Pengajuan</button></div>`;
return `<div class=pad><h2 style="margin-bottom:12px">${adm?'Persetujuan Tugas Luar':'Tugas Luar Kantor'}</h2>${form}<div class=card><h3>${adm?'Semua pengajuan':'Pengajuan saya'}</h3>${L.length?L.map(([t,i])=>{const e=emps[t.who];return `<div class=row style="align-items:flex-start">${av(e.a,40)}<div><b>${E(t.p)}</b><br><small>${E(e.n)} · 📍 ${E(t.l)}</small><br><small>${E(t.w)}</small></div>${t.s=='pending'&&adm?`<div style="display:grid;gap:6px"><button class="btn g" onclick="decide(${i},'disetujui')">Setujui</button><button class="btn o" onclick="decide(${i},'ditolak')">Tolak</button></div>`:`<span class="chip ${t.s=='disetujui'?'hadir':t.s=='ditolak'?'absen':'telat'}">${t.s=='pending'?'Menunggu':t.s=='disetujui'?'Disetujui':'Ditolak'}</span>`}</div>`}).join(''):'<small>Belum ada pengajuan.</small>'}</div></div>`}
function rank(){const s=[...emps].sort((a,b)=>b.xp-a.xp);return `<div class=pad><h2 style="margin-bottom:12px">Leaderboard 🏆</h2><div class=card>${s.map((e,i)=>`<div class=row style="${e.id==S.me?'background:#8b5cf622;border-radius:14px;padding-left:8px':''}"><b style="width:26px;font-size:18px">${['🥇','🥈','🥉'][i]||i+1}</b>${av(e.a,42)}<div><b>${E(e.n)}</b><br><small>${E(e.r)} · 🔥 ${e.sk}</small></div><b>${e.xp} XP</b></div>`).join('')}</div></div>`}
function prof(){const e=X();if(S.edit){const d=S.edit;return `<div class=pad><h2 style="margin-bottom:12px">Edit Profil</h2><div class="card mid">${av(d.a,110)}</div><div class=card><small>Nama</small><input value="${E(d.n)}" oninput="S.edit.n=this.value"><small>Jabatan</small><input value="${E(d.r)}" oninput="S.edit.r=this.value"><small>Pilih karakter</small><div class=grid style="margin-top:6px">${A.map((_,i)=>`<div class="${i==d.a?'on':''}" onclick="S.edit.a=${i};R()">${av(i,80)}</div>`).join('')}</div></div><div class=sp><button class=btn style="flex:1;padding:14px" onclick="S.edit=null;R()">Batal</button><button class="btn p" style="flex:1;padding:14px" onclick="saveProf()">Simpan</button></div></div>`}
const lv=Math.floor(e.xp/500)+1;return `<div class=pad><div class="card mid">${av(e.a,120)}<h2 style="margin-top:8px">${E(e.n)}</h2><small>${E(e.r)} · Level ${lv}</small><br><button class="btn p" style="margin-top:12px" onclick="S.edit={n:X().n,r:X().r,a:X().a};R()">✏️ Edit nama, jabatan & karakter</button></div>${lateCard(e)}<div class="card stat"><div><b>${e.xp}</b><small>XP</small></div><div><b>🔥${e.sk}</b><small>Streak</small></div><div><b>${lv}</b><small>Level</small></div></div><button class=btn style="width:100%" onclick="Object.assign(X(),{st:'belum',tin:'',tout:''});toast('Hari ini direset untuk demo')">Reset status hari ini (demo)</button></div>`}
function dash(){const g=s=>emps.filter(e=>e.st==s),b=g('belum');
const sec=(t,l,f)=>`<div class=card><h3>${t} (${l.length})</h3>${l.length?l.map(f).join(''):'<small>Tidak ada.</small>'}</div>`,rw=(e,r)=>`<div class=row onclick="S.det=${e.id};R()">${av(e.a,42)}<div><b>${E(e.n)}</b><br><small>${E(e.r)}</small></div>${r}</div>`;
return `<div class=pad><h2 style="margin-bottom:12px">Dashboard Tim</h2><div class="card stat"><div><b class=hadir>${g('hadir').length}</b><small>Hadir</small></div><div><b class=telat>${g('telat').length}</b><small>Terlambat</small></div><div><b class=belum>${b.length}</b><small>Belum</small></div></div>
${sec('✅ Hadir',g('hadir'),e=>rw(e,chipE(e)))}${sec('⏰ Terlambat',g('telat'),e=>rw(e,chipE(e)))}${sec('🕒 Belum hadir',b,e=>rw(e,`<div style="display:flex;gap:6px"><button class=btn onclick="event.stopPropagation();setSt(${e.id},'absen')">Absent</button><button class=btn onclick="event.stopPropagation();setSt(${e.id},'libur')">Day Off</button></div>`))}${sec('Absent / Day Off',emps.filter(e=>e.st=='absen'||e.st=='libur'),e=>rw(e,chipE(e)))}</div>`}
const staff=()=>`<div class=pad><h2 style="margin-bottom:12px">Daftar Karyawan</h2><div class=card>${emps.map(e=>`<div class=row onclick="S.det=${e.id};R()">${av(e.a,44)}<div><b>${E(e.n)}</b><br><small>${E(e.r)} · telat ${ms(e).l} mnt</small></div>${chipE(e)}</div>`).join('')}</div></div>`;
function rekap(){const r=emps.map(e=>({e,...ms(e)})).sort((a,b)=>b.l-a.l),T=r.reduce((s,x)=>s+x.l,0);return `<div class=pad><h2 style="margin-bottom:12px">Rekap Bulanan</h2><div class="card late"><small>November 2026 · total telat seluruh tim</small><h2>${T} menit</h2></div><div class=card style="padding:10px"><table><tr><th>Nama</th><th>Hadir</th><th>Telat</th><th>Menit</th><th>Abs</th><th>Off</th></tr>${r.map(x=>`<tr onclick="S.det=${x.e.id};R()"><td>${E(x.e.n.split(' ')[0])}</td><td>${x.h}</td><td>${x.t}×</td><td class=${x.l?'telat':'hadir'}><b>${x.l}</b></td><td>${x.a}</td><td>${x.o}</td></tr>`).join('')}</table></div><small>Ketuk baris untuk melihat detail.</small></div>`}
function sheet(){const e=emps[S.det],m=ms(e);return `<div class=sheet onclick="S.det=null;R()"><div onclick="event.stopPropagation()"><div class=hd>${av(e.a,64)}<div><h2>${E(e.n)}</h2><small>${E(e.r)}</small></div><button class=btn onclick="S.det=null;R()">✕</button></div><div class="card stat"><div><b class=telat>${m.l}</b><small>menit telat</small></div><div><b>${m.h}</b><small>hari hadir</small></div><div><b>${m.a}/${m.o}</b><small>absent/off</small></div></div><small>Atur status hari ini:</small><div style="display:flex;gap:6px;margin:8px 0 14px"><button class=btn style="flex:1" onclick="setSt(${e.id},'absen')">Absent</button><button class=btn style="flex:1" onclick="setSt(${e.id},'libur')">Day Off</button><button class=btn style="flex:1" onclick="setSt(${e.id},'belum')">Reset</button></div><div class=card>${hist(e)||'<small>Belum ada data.</small>'}</div></div></div>`}
const TE=[['home','🏠','Beranda'],['hist','🗓️','Riwayat'],['task','📍','Tugas'],['rank','🏆','Peringkat'],['prof','🙂','Profil']],TA=[['dash','📊','Dashboard'],['atask','📍','Tugas'],['staff','👥','Tim'],['rekap','🧾','Rekap']];
function R(){const emp=S.role=='emp',T=emp?TE:TA,v={home,hist:hist_,task:()=>tk(0),rank,prof,dash,atask:()=>tk(1),staff,rekap}[S.tab]();
$('app').innerHTML=`<div class=top><div class=logo>CREATIVE <span>CREW</span></div><div class=seg><button class="${emp?'on':''}" onclick="setRole('emp')">Karyawan</button><button class="${emp?'':'on'}" onclick="setRole('adm')">Admin</button></div></div>${v}<div class=nav>${T.map(([k,i,n])=>`<button class="${S.tab==k?'on':''}" onclick="tab('${k}')"><b>${i}</b>${n}</button>`).join('')}</div>${S.det!=null?sheet():''}${S.t?`<div class=toast>${S.t}</div>`:''}`}
R();
</script></body></html>
